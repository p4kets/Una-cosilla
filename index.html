<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi florecilla 🌸</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, 'Times New Roman', serif;
            background:
                radial-gradient(circle at 50% 35%, #25204a 0%, #111126 45%, #080811 100%);
            color: white;
        }

        /* Fondo de estrellas */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: twinkle 3s infinite ease-in-out;
        }

        .star:nth-child(1) { left: 8%; top: 15%; animation-delay: 0s; }
        .star:nth-child(2) { left: 18%; top: 32%; animation-delay: 1s; }
        .star:nth-child(3) { left: 30%; top: 12%; animation-delay: 2s; }
        .star:nth-child(4) { left: 42%; top: 25%; animation-delay: 0.5s; }
        .star:nth-child(5) { left: 55%; top: 10%; animation-delay: 1.5s; }
        .star:nth-child(6) { left: 67%; top: 28%; animation-delay: 2.5s; }
        .star:nth-child(7) { left: 78%; top: 14%; animation-delay: 1s; }
        .star:nth-child(8) { left: 90%; top: 35%; animation-delay: 0.2s; }
        .star:nth-child(9) { left: 12%; top: 65%; animation-delay: 2s; }
        .star:nth-child(10) { left: 25%; top: 78%; animation-delay: 1s; }
        .star:nth-child(11) { left: 75%; top: 70%; animation-delay: 2.5s; }
        .star:nth-child(12) { left: 88%; top: 82%; animation-delay: 0.5s; }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        /* Contenido principal */
        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .card {
            width: min(650px, 95%);
            padding: 55px 35px;
            background: rgba(18, 16, 40, 0.72);
            border: 1px solid rgba(255, 190, 230, 0.18);
            border-radius: 30px;
            box-shadow:
                0 0 50px rgba(150, 100, 220, 0.15),
                inset 0 0 30px rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            animation: appear 1.5s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .flower {
            font-size: 55px;
            margin-bottom: 18px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }
            50% {
                transform: translateY(-10px) rotate(3deg);
            }
        }

        .small-title {
            font-size: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #cdbce9;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(38px, 8vw, 65px);
            font-weight: normal;
            line-height: 1.1;
            margin-bottom: 18px;
            background: linear-gradient(90deg, #fff, #f2c8e9, #d8c8ff, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.7;
            color: #d8d4e5;
            margin: 0 auto 35px;
            max-width: 500px;
        }

        .birthday {
            display: inline-block;
            margin-bottom: 30px;
            padding: 9px 18px;
            border-radius: 50px;
            background: rgba(220, 170, 220, 0.1);
            border: 1px solid rgba(220, 170, 220, 0.2);
            color: #e7cce4;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .start-button {
            border: none;
            padding: 16px 34px;
            border-radius: 50px;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 17px;
            color: #171322;
            background: linear-gradient(135deg, #f4c7e8, #d7c5ff);
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(220, 180, 240, 0.2);
            transition: 0.3s ease;
        }

        .start-button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 35px rgba(220, 180, 240, 0.35);
        }

        .start-button:active {
            transform: scale(0.97);
        }

        .hint {
            margin-top: 22px;
            font-size: 12px;
            color: #858197;
        }

        /* Flores decorativas */
        .decoration {
            position: fixed;
            z-index: 1;
            font-size: 30px;
            opacity: 0.35;
            animation: float 5s ease-in-out infinite;
        }

        .flower1 {
            left: 7%;
            bottom: 10%;
        }

        .flower2 {
            right: 8%;
            top: 15%;
            animation-delay: 1s;
        }

        .flower3 {
            right: 12%;
            bottom: 12%;
            font-size: 22px;
            animation-delay: 2s;
        }

        /* Pantallas siguientes */
        .hidden {
            display: none;
        }

        .fade-out {
            animation: fadeOut 0.8s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(1.03);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 45px 22px;
                border-radius: 25px;
            }

            .flower {
                font-size: 45px;
            }

            .subtitle {
                font-size: 16px;
            }

            .small-title {
                font-size: 12px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <!-- Estrellas -->
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <!-- Decoraciones -->
    <div class="decoration flower1">🌸</div>
    <div class="decoration flower2">✦</div>
    <div class="decoration flower3">🌷</div>

    <!-- Portada -->
    <main class="container" id="intro">

        <section class="card">

            <div class="flower">🌸</div>

            <div class="small-title">
                Una pequeña sorpresa
            </div>

            <h1>Para mi florecilla</h1>

            <p class="subtitle">
                Hoy es un día un poquito especial...
                y alguien muy pequeñita ha recibido
                una misión.
            </p>

            <div class="birthday">
                ✦ 28 de octubre ✦
            </div>

            <br>

            <button class="start-button" onclick="startAdventure()">
                Comenzar aventura ✨
            </button>

            <p class="hint">
                Pista: sí, esto lo he hecho yo para ti.
            </p>

        </section>

    </main>

    <script>
        function startAdventure() {

            const intro = document.getElementById("intro");

            intro.classList.add("fade-out");

            setTimeout(() => {

                intro.innerHTML = `
                    <section class="card">
                        <div class="flower">🌙</div>

                        <div class="small-title">
                            Misión iniciada
                        </div>

                        <h1>Hola, petit</h1>

                        <p class="subtitle">
                            Si has llegado hasta aquí significa que
                            has decidido aceptar el reto.
                            <br><br>
                            Pero antes de llegar al final...
                            tendrás que superar unas pequeñas pruebas.
                        </p>

                        <button class="start-button" onclick="alert('Esta es solo la primera parte 👀. Pronto habrá mucho más...')">
                            Continuar →
                        </button>
                    </section>
                `;

                intro.classList.remove("fade-out");

            }, 800);
        }
    </script>

</body>
</html>
