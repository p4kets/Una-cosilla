<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Salma 🌸</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family: Georgia, "Times New Roman", serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #29234d 0%,
                    #17152e 42%,
                    #090912 100%
                );
        }


        /* =========================
           ESTRELLAS
        ========================== */

        .stars {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 0;
        }

        .star {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: white;

            opacity: 0.4;

            animation:
                twinkle 3s infinite ease-in-out;
        }

        .star:nth-child(1) {
            left: 8%;
            top: 15%;
            animation-delay: 0s;
        }

        .star:nth-child(2) {
            left: 18%;
            top: 32%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            left: 30%;
            top: 12%;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            left: 42%;
            top: 25%;
            animation-delay: .5s;
        }

        .star:nth-child(5) {
            left: 55%;
            top: 10%;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            left: 67%;
            top: 28%;
            animation-delay: 2.5s;
        }

        .star:nth-child(7) {
            left: 78%;
            top: 14%;
            animation-delay: 1s;
        }

        .star:nth-child(8) {
            left: 90%;
            top: 35%;
            animation-delay: .2s;
        }

        .star:nth-child(9) {
            left: 12%;
            top: 65%;
            animation-delay: 2s;
        }

        .star:nth-child(10) {
            left: 25%;
            top: 78%;
            animation-delay: 1s;
        }

        .star:nth-child(11) {
            left: 75%;
            top: 70%;
            animation-delay: 2.5s;
        }

        .star:nth-child(12) {
            left: 88%;
            top: 82%;
            animation-delay: .5s;
        }

        @keyframes twinkle {

            0%, 100% {
                opacity: .2;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }

        }


        /* =========================
           PANTALLA
        ========================== */

        .screen {

            position: relative;

            z-index: 2;

            width: 100%;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            transition:
                opacity .7s ease,
                transform .7s ease;
        }

        .screen.fade-out {

            opacity: 0;

            transform: scale(1.03);
        }


        /* =========================
           TARJETA
        ========================== */

        .card {

            width: min(650px, 95%);

            max-height: 92vh;

            overflow-y: auto;

            padding: 50px 35px;

            text-align: center;

            background:
                rgba(19, 17, 42, .80);

            border:
                1px solid rgba(240, 200, 235, .18);

            border-radius: 30px;

            box-shadow:
                0 0 60px rgba(150, 100, 220, .14),
                inset 0 0 35px rgba(255, 255, 255, .02);

            backdrop-filter: blur(12px);

            animation:
                cardAppear 1s ease-out;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================
           FLORES / ICONOS
        ========================== */

        .flower {

            font-size: 55px;

            margin-bottom: 18px;

            animation:
                floating 3.5s ease-in-out infinite;
        }

        @keyframes floating {

            0%, 100% {
                transform:
                    translateY(0)
                    rotate(-3deg);
            }

            50% {
                transform:
                    translateY(-10px)
                    rotate(3deg);
            }

        }


        /* =========================
           TEXTOS
        ========================== */

        .eyebrow {

            font-size: 14px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: #cbbce5;

            margin-bottom: 18px;
        }

        .mission {

            display: inline-block;

            margin-bottom: 18px;

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #a9a1bd;
        }

        h1 {

            font-size:
                clamp(40px, 9vw, 68px);

            font-weight: normal;

            line-height: 1.1;

            margin-bottom: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #f1c9e8,
                    #d5c8ff,
                    #ffffff
                );

            background-size: 200% auto;

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                shine 5s linear infinite;
        }

        h2 {

            font-size:
                clamp(30px, 7vw, 48px);

            font-weight: normal;

            margin-bottom: 25px;

            color: #f3d9ed;
        }

        .text {

            max-width: 500px;

            margin:
                0 auto 30px;

            color: #d8d4e5;

            font-size: 18px;

            line-height: 1.8;
        }

        @keyframes shine {

            to {
                background-position:
                    200% center;
            }

        }


        /* =========================
           FECHA
        ========================== */

        .date {

            display: inline-block;

            margin-bottom: 30px;

            padding:
                9px 18px;

            border-radius: 50px;

            background:
                rgba(220, 170, 220, .08);

            border:
                1px solid rgba(220, 170, 220, .18);

            color: #e8cde5;

            font-size: 14px;

            letter-spacing: 1px;
        }


        /* =========================
           BOTONES
        ========================== */

        .button {

            border: none;

            padding:
                16px 34px;

            border-radius: 50px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;

            color: #181322;

            background:
                linear-gradient(
                    135deg,
                    #f4c7e8,
                    #d8c8ff
                );

            cursor: pointer;

            box-shadow:
                0 8px 30px
                rgba(220, 180, 240, .2);

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        .button:hover {

            transform:
                translateY(-3px)
                scale(1.03);

            box-shadow:
                0 12px 35px
                rgba(220, 180, 240, .35);
        }

        .button:active {

            transform:
                scale(.97);
        }


        /* =========================
           OPCIONES DEL QUIZ
        ========================== */

        .question {

            font-size: 21px;

            line-height: 1.6;

            color: #eeeaf5;

            margin:
                0 auto 25px;

            max-width: 520px;
        }

        .answers {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            max-width: 500px;

            margin:
                0 auto;
        }

        .answer {

            padding: 16px 14px;

            border-radius: 18px;

            border:
                1px solid
                rgba(230, 210, 240, .15);

            background:
                rgba(255, 255, 255, .045);

            color: #eeeaf5;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 15px;

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;
        }

        .answer:hover {

            transform:
                translateY(-3px);

            background:
                rgba(230, 200, 240, .10);

            border-color:
                rgba(240, 200, 235, .35);
        }


        /* =========================
           RESULTADO
        ========================== */

        .success {

            animation:
                successAppear .6s ease-out;
        }

        @keyframes successAppear {

            from {

                opacity: 0;

                transform:
                    scale(.9)
                    translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }

        }

        .points {

            display: inline-block;

            margin-top: 8px;

            padding:
                7px 14px;

            border-radius: 30px;

            background:
                rgba(220, 180, 240, .08);

            color:
                #d8c8ff;

            font-size: 13px;
        }


        /* =========================
           DECORACIONES
        ========================== */

        .decoration {

            position: fixed;

            z-index: 1;

            opacity: .35;

            pointer-events: none;

            animation:
                floating 5s ease-in-out infinite;
        }

        .decoration.one {

            left: 7%;
            bottom: 10%;

            font-size: 30px;
        }

        .decoration.two {

            right: 8%;
            top: 15%;

            font-size: 27px;

            animation-delay: 1s;
        }

        .decoration.three {

            right: 12%;
            bottom: 12%;

            font-size: 23px;

            animation-delay: 2s;
        }


        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {

            .screen {
                padding: 15px;
            }

            .card {

                padding:
                    40px 20px;

                border-radius: 25px;

                max-height: 94vh;
            }

            .flower {
                font-size: 45px;
            }

            .text {
                font-size: 16px;
            }

            .eyebrow {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .answers {

                grid-template-columns:
                    1fr;
            }

            .answer {

                padding:
                    14px 12px;
            }

            .button {

                width: 100%;

                max-width: 300px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         ESTRELLAS
    ========================== -->

    <div class="stars">

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

    </div>


    <!-- =========================
         DECORACIONES
    ========================== -->

    <div class="decoration one">
        🌸
    </div>

    <div class="decoration two">
        ✦
    </div>

    <div class="decoration three">
        🌷
    </div>


    <!-- =========================
         PANTALLA PRINCIPAL
    ========================== -->

    <main
        class="screen"
        id="screen"
    >

        <section
            class="card"
            id="content"
        >

            <div class="flower">
                🌸
            </div>

            <div class="eyebrow">
                Una pequeña sorpresa
            </div>

            <h1>
                Para mi florecilla
            </h1>

            <p class="text">

                Hoy es un día un poquito especial...
                y alguien muy pequeñita ha recibido
                una misión.

            </p>

            <div class="date">
                ✦ 28 de octubre ✦
            </div>

            <br>

            <button
                class="button"
                onclick="startAdventure()"
            >
                Comenzar aventura ✨
            </button>

            <p class="hint">
                Pista: sí, esto lo he hecho yo para ti.
            </p>

        </section>

    </main>


    <script>


        /* =========================
           CAMBIAR PANTALLA
        ========================== */

        function changeScreen(newContent) {

            const screen =
                document.getElementById("screen");

            const content =
                document.getElementById("content");


            screen.classList.add("fade-out");


            setTimeout(() => {

                content.innerHTML =
                    newContent;

                screen.classList.remove(
                    "fade-out"
                );

            }, 700);

        }



        /* =========================
           COMENZAR AVENTURA
        ========================== */

        function startAdventure() {

            changeScreen(`

                <div class="flower">
                    🌙
                </div>

                <div class="mission">
                    MISIÓN INICIADA
                </div>

                <h2>
                    Hola, petit
                </h2>

                <p class="text">

                    Si estás viendo esto significa
                    que has decidido aceptar el reto.

                    <br><br>

                    Antes de llegar al final,
                    tendrás que superar algunas
                    pequeñas pruebas.

                    <br><br>

                    No te preocupes...

                    <br>

                    creo que eres capaz de conseguirlo. 👀

                </p>

                <button
                    class="button"
                    onclick="firstTest()"
                >
                    Aceptar misión ✨
                </button>

            `);

        }



        /* =========================
           PRIMERA PRUEBA
        ========================== */

        function firstTest() {

            changeScreen(`

                <div class="flower">
                    🐾
                </div>

                <div class="mission">
                    MISIÓN 1 / 4
                </div>

                <h2>
                    El juicio felino
                </h2>

                <p class="question">

                    Primera pregunta...

                    <br><br>

                    ¿Qué elegiría probablemente
                    Petit para pasar un día perfecto?

                </p>


                <div class="answers">

                    <button
                        class="answer"
                        onclick="catAnswer(1)"
                    >
                        🐱 Un mundo lleno de gatos
                    </button>


                    <button
                        class="answer"
                        onclick="catAnswer(2)"
                    >
                        🧛 Convertirse en vampiro
                    </button>


                    <button
                        class="answer"
                        onclick="catAnswer(3)"
                    >
                        🎮 Jugar OSU! durante 12 horas
                    </button>


                    <button
                        class="answer"
                        onclick="catAnswer(4)"
                    >
                        🥔 Ser un minion
                    </button>

                </div>

                <p class="hint">
                    Elige sabiamente... o no. 👀
                </p>

            `);

        }



        /* =========================
           RESPUESTAS
        ========================== */

        function catAnswer(answer) {

            let message = "";


            if (answer === 1) {

                message = `
                    Era demasiado fácil. 🐱
                    <br><br>
                    El consejo felino aprueba
                    completamente tu respuesta.
                `;

            }


            if (answer === 2) {

                message = `
                    Tiene sentido. 🧛
                    <br><br>
                    Después de tanto
                    Vampire Diaries,
                    era prácticamente inevitable.
                `;

            }


            if (answer === 3) {

                message = `
                    Una respuesta completamente válida. 🎮
                    <br><br>
                    Aunque tus manos probablemente
                    necesiten unas vacaciones después.
                `;

            }


            if (answer === 4) {

                message = `
                    ...
                    <br><br>
                    No voy a hacer preguntas. 😂
                    <br><br>
                    Pero el consejo de minions
                    ha aprobado tu respuesta.
                `;

            }


            changeScreen(`

                <div class="success">

                    <div class="flower">
                        ✨
                    </div>

                    <div class="mission">
                        VEREDICTO
                    </div>

                    <h2>
                        ¡Correcto!
                    </h2>

                    <p class="text">

                        ${message}

                        <br><br>

                        Parece que has superado
                        la primera prueba.

                    </p>

                    <div class="points">
                        +1 punto de florecilla 🌸
                    </div>

                    <br><br>

                    <button
                        class="button"
                        onclick="secondTest()"
                    >
                        Siguiente prueba →
                    </button>

                </div>

            `);

        }



        /* =========================
           SEGUNDA PRUEBA
        ========================== */

       function secondTest() {

    changeScreen(`

        <div class="flower">
            🧛
        </div>

        <div class="mission">
            MISIÓN 2 / 4
        </div>

        <h2>
            El expediente de Salma
        </h2>

        <p class="text">

            El consejo de Mystic Falls
            necesita comprobar una cosa...

            <br><br>

            Si tuvieras que sobrevivir
            en el mundo de <i>The Vampire Diaries</i>,
            ¿qué elegirías?

        </p>

        <div class="answers">

            <button
                class="answer"
                onclick="vampireAnswer(1)"
            >
                🧛 Convertirme en vampiro
            </button>

            <button
                class="answer"
                onclick="vampireAnswer(2)"
            >
                🌙 Vivir en Mystic Falls
            </button>

            <button
                class="answer"
                onclick="vampireAnswer(3)"
            >
                🩸 Meterme en todos los dramas
            </button>

            <button
                class="answer"
                onclick="vampireAnswer(4)"
            >
                🐱 Llevarme un gato y olvidarme de todo
            </button>

        </div>

    `);

}


function vampireAnswer(answer) {

    const messages = {

        1: `
            <div class="flower">
                🧛
            </div>

            <div class="mission">
                MISIÓN SUPERADA
            </div>

            <h2>
                Buena elección.
            </h2>

            <p class="text">

                Aunque viendo todo lo que pasa
                en Mystic Falls, quizá no sea
                la decisión más segura...

            </p>
        `,

        2: `
            <div class="flower">
                🌙
            </div>

            <div class="mission">
                MISIÓN SUPERADA
            </div>

            <h2>
                Valiente decisión.
            </h2>

            <p class="text">

                Eso sí, intenta no acercarte
                demasiado a ningún vampiro.
                Nunca se sabe.

            </p>
        `,

        3: `
            <div class="flower">
                🩸
            </div>

            <div class="mission">
                MISIÓN SUPERADA
            </div>

            <h2>
                Esa es probablemente la más realista.
            </h2>

            <p class="text">

                En Mystic Falls es imposible
                escapar del drama.
                Así que mejor asumirlo desde el principio.

            </p>
        `,

        4: `
            <div class="flower">
                🐱
            </div>

            <div class="mission">
                MISIÓN SUPERADA
            </div>

            <h2>
                La respuesta más inteligente.
            </h2>

            <p class="text">

                Vampiros, dramas y problemas...
                mejor un gato y a casa.

            </p>
        `

    };

    changeScreen(messages[answer] + `

        <button
            class="button"
            onclick="thirdTest()"
        >
            Siguiente prueba →
        </button>

    `);

}

    const result = document.getElementById("vampire-result");

    const messages = {

        1: `
            🧛
            <br><br>
            Buena elección.
            Aunque viendo todo lo que pasa en Mystic Falls,
            quizá no sea la decisión más segura...
        `,

        2: `
            🌙
            <br><br>
            Valiente decisión.
            Yo personalmente intentaría no acercarme
            demasiado a ningún vampiro.
        `,

        3: `
            🩸
            <br><br>
            Esa es probablemente la respuesta más
            realista de todas.
            En Mystic Falls es imposible escapar del drama.
        `,

        4: `
            🐱
            <br><br>
            La respuesta más inteligente.
            Vampiros, dramas y problemas...
            mejor un gato y a casa.
        `

    };

    result.innerHTML = messages[answer] + `

        <br><br>

        <button
            class="button"
            onclick="thirdTest()"
        >
            Siguiente prueba →
        </button>

    `;

}


    </script>

</body>
</html>
