<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Salma 🌸</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #29234d 0%,
                    #17152e 42%,
                    #090912 100%
                );
        }

        /* =========================
           ESTRELLAS
        ========================= */

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: white;
            opacity: 0.4;
            animation: twinkle 3s infinite ease-in-out;
        }

        .star:nth-child(1) {
            left: 8%;
            top: 15%;
            animation-delay: 0s;
        }

        .star:nth-child(2) {
            left: 18%;
            top: 32%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            left: 30%;
            top: 12%;
            animation-delay: 2s;
        }

        .star:nth-child(4) {
            left: 42%;
            top: 25%;
            animation-delay: 0.5s;
        }

        .star:nth-child(5) {
            left: 55%;
            top: 10%;
            animation-delay: 1.5s;
        }

        .star:nth-child(6) {
            left: 67%;
            top: 28%;
            animation-delay: 2.5s;
        }

        .star:nth-child(7) {
            left: 78%;
            top: 14%;
            animation-delay: 1s;
        }

        .star:nth-child(8) {
            left: 90%;
            top: 35%;
            animation-delay: 0.2s;
        }

        .star:nth-child(9) {
            left: 12%;
            top: 65%;
            animation-delay: 2s;
        }

        .star:nth-child(10) {
            left: 25%;
            top: 78%;
            animation-delay: 1s;
        }

        .star:nth-child(11) {
            left: 75%;
            top: 70%;
            animation-delay: 2.5s;
        }

        .star:nth-child(12) {
            left: 88%;
            top: 82%;
            animation-delay: 0.5s;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* =========================
           PANTALLA
        ========================= */

        .screen {
            position: relative;
            z-index: 2;

            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
        }

        .screen.fade-out {
            opacity: 0;
            transform: scale(1.03);
        }

        /* =========================
           TARJETA
        ========================= */

        .card {
            width: min(650px, 95%);

            padding: 55px 35px;

            text-align: center;

            background: rgba(19, 17, 42, 0.78);

            border: 1px solid rgba(240, 200, 235, 0.18);

            border-radius: 30px;

            box-shadow:
                0 0 60px rgba(150, 100, 220, 0.14),
                inset 0 0 35px rgba(255, 255, 255, 0.02);

            backdrop-filter: blur(12px);

            animation: cardAppear 1s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           FLORES
        ========================= */

        .flower {
            font-size: 55px;
            margin-bottom: 18px;

            animation: floating 3.5s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }

            50% {
                transform: translateY(-10px) rotate(3deg);
            }
        }

        /* =========================
           TEXTO
        ========================= */

        .eyebrow {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;

            color: #cbbce5;

            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(40px, 9vw, 68px);

            font-weight: normal;

            line-height: 1.1;

            margin-bottom: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #f1c9e8,
                    #d5c8ff,
                    #ffffff
                );

            background-size: 200% auto;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        h2 {
            font-size: clamp(30px, 7vw, 48px);

            font-weight: normal;

            margin-bottom: 25px;

            color: #f3d9ed;
        }

        .text {
            max-width: 500px;

            margin: 0 auto 30px;

            color: #d8d4e5;

            font-size: 18px;

            line-height: 1.8;
        }

        .date {
            display: inline-block;

            margin-bottom: 30px;

            padding: 9px 18px;

            border-radius: 50px;

            background: rgba(220, 170, 220, 0.08);

            border: 1px solid rgba(220, 170, 220, 0.18);

            color: #e8cde5;

            font-size: 14px;

            letter-spacing: 1px;
        }

        /* =========================
           BOTONES
        ========================= */

        .button {
            border: none;

            padding: 16px 34px;

            border-radius: 50px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 17px;

            color: #181322;

            background:
                linear-gradient(
                    135deg,
                    #f4c7e8,
                    #d8c8ff
                );

            cursor: pointer;

            box-shadow:
                0 8px 30px rgba(220, 180, 240, 0.2);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .button:hover {
            transform: translateY(-3px) scale(1.03);

            box-shadow:
                0 12px 35px rgba(220, 180, 240, 0.35);
        }

        .button:active {
            transform: scale(0.97);
        }

        /* =========================
           TEXTO PEQUEÑO
        ========================= */

        .hint {
            margin-top: 22px;

            font-size: 12px;

            color: #817c96;
        }

        /* =========================
           DECORACIONES
        ========================= */

        .decoration {
            position: fixed;

            z-index: 1;

            opacity: 0.35;

            pointer-events: none;

            animation: floating 5s ease-in-out infinite;
        }

        .decoration.one {
            left: 7%;
            bottom: 10%;

            font-size: 30px;
        }

        .decoration.two {
            right: 8%;
            top: 15%;

            font-size: 27px;

            animation-delay: 1s;
        }

        .decoration.three {
            right: 12%;
            bottom: 12%;

            font-size: 23px;

            animation-delay: 2s;
        }

        /* =========================
           INDICADOR DE MISIÓN
        ========================= */

        .mission {
            display: inline-block;

            margin-bottom: 20px;

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #a9a1bd;
        }

        /* =========================
           MÓVIL
        ========================= */

        @media (max-width: 600px) {

            .screen {
                padding: 18px;
            }

            .card {
                padding: 42px 22px;

                border-radius: 25px;
            }

            .flower {
                font-size: 45px;
            }

            .text {
                font-size: 16px;
            }

            .eyebrow {
                font-size: 11px;

                letter-spacing: 3px;
            }

            .button {
                width: 100%;

                max-width: 280px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ESTRELLAS
    ========================== -->

    <div class="stars">

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

    </div>


    <!-- =========================
         DECORACIONES
    ========================== -->

    <div class="decoration one">🌸</div>

    <div class="decoration two">✦</div>

    <div class="decoration three">🌷</div>


    <!-- =========================
         CONTENEDOR PRINCIPAL
    ========================== -->

    <main
        class="screen"
        id="screen"
    >

        <!-- =========================
             PORTADA
        ========================== -->

        <section
            class="card"
            id="content"
        >

            <div class="flower">
                🌸
            </div>

            <div class="eyebrow">
                Una pequeña sorpresa
            </div>

            <h1>
                Para mi florecilla
            </h1>

            <p class="text">
                Hoy es un día un poquito especial...
                y alguien muy pequeñita ha recibido
                una misión.
            </p>

            <div class="date">
                ✦ 28 de octubre ✦
            </div>

            <br>

            <button
                class="button"
                onclick="startAdventure()"
            >
                Comenzar aventura ✨
            </button>

            <p class="hint">
                Pista: sí, esto lo he hecho yo para ti.
            </p>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function changeScreen(newContent) {

            const screen =
                document.getElementById("screen");

            const content =
                document.getElementById("content");


            /* Desaparece */

            screen.classList.add("fade-out");


            setTimeout(() => {

                /* Cambiamos el contenido */

                content.innerHTML = newContent;


                /* Volvemos a mostrar */

                screen.classList.remove("fade-out");

            }, 700);
        }



        function startAdventure() {

            changeScreen(`

                <div class="flower">
                    🌙
                </div>

                <div class="mission">
                    MISIÓN INICIADA
                </div>

                <h2>
                    Hola, petit
                </h2>

                <p class="text">

                    Si estás viendo esto significa
                    que has decidido aceptar el reto.

                    <br><br>

                    Antes de llegar al final,
                    tendrás que superar algunas
                    pequeñas pruebas.

                    <br><br>

                    No te preocupes...

                    <br>

                    creo que eres capaz de conseguirlo. 👀

                </p>

                <button
                    class="button"
                    onclick="beginFirstTest()"
                >
                    Aceptar misión ✨
                </button>

            `);

        }



        function beginFirstTest() {

            changeScreen(`

                <div class="flower">
                    🐾
                </div>

                <div class="mission">
                    PRÓXIMAMENTE
                </div>

                <h2>
                    Primera prueba
                </h2>

                <p class="text">

                    Aquí comenzará la aventura
                    de verdad.

                    <br><br>

                    Tendrás que demostrar que
                    conoces muy bien tus propios
                    gustos...

                    <br><br>

                    Especialmente uno que tiene
                    cuatro patas y probablemente
                    te juzga en silencio. 🐱

                </p>

                <button
                    class="button"
                    onclick="backToIntro()"
                >
                    Volver
                </button>

            `);

        }



        function backToIntro() {

            changeScreen(`

                <div class="flower">
                    🌸
                </div>

                <div class="eyebrow">
                    Una pequeña sorpresa
                </div>

                <h1>
                    Para mi florecilla
                </h1>

                <p class="text">
                    Parece que todavía no estás
                    preparada para la misión...
                    👀
                </p>

                <button
                    class="button"
                    onclick="startAdventure()"
                >
                    Intentarlo otra vez
                </button>

            `);

        }

    </script>

</body>
</html>
